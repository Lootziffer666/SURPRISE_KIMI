name: Prepare and screenshot Kimi prototype

on:
  push:
    paths:
      - 'incoming/ebe30507.zip'

permissions:
  contents: write

jobs:
  test-and-screenshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract supplied one-shot
        run: |
          set -euo pipefail
          test -f incoming/ebe30507.zip
          rm -rf snow-resource-game
          unzip -q incoming/ebe30507.zip -d .
          test -f snow-resource-game/package.json

      - name: Install and build
        working-directory: snow-resource-game
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        working-directory: snow-resource-game
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/surprise-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/surprise-preview.log
          exit 1

      - name: Runtime test and screenshots
        working-directory: snow-resource-game
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const out = path.join(process.env.GITHUB_WORKSPACE, 'docs', 'screenshots');
          fs.mkdirSync(out, { recursive: true });
          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist']
          });
          const page = await browser.newPage({ viewport: { width: 1365, height: 768 } });
          const errors = [];
          const warnings = [];
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('console', msg => {
            if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
            if (msg.type() === 'warning') warnings.push(msg.text());
          });

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(1800);
          const canvas = page.locator('canvas').first();
          if (await page.locator('canvas').count() < 1) throw new Error('No canvas rendered');
          const box = await canvas.boundingBox();
          if (!box || box.width < 100 || box.height < 100) throw new Error('Canvas has invalid size');
          const webgl = await page.evaluate(() => {
            const c = document.querySelector('canvas');
            return Boolean(c && (c.getContext('webgl2') || c.getContext('webgl')));
          });
          if (!webgl) throw new Error('No WebGL context');

          await page.screenshot({ path: path.join(out, '01-start.png'), fullPage: true });
          await page.keyboard.down('w');
          await page.waitForTimeout(1100);
          await page.keyboard.up('w');
          await page.waitForTimeout(500);
          await page.screenshot({ path: path.join(out, '02-after-keyboard-input.png'), fullPage: true });
          await page.mouse.click(box.x + box.width * 0.72, box.y + box.height * 0.62);
          await page.waitForTimeout(1400);
          await page.screenshot({ path: path.join(out, '03-after-click-move.png'), fullPage: true });

          const report = {
            testedAt: new Date().toISOString(),
            url: page.url(),
            title: await page.title(),
            canvas: { width: box.width, height: box.height, webgl },
            interactions: ['keyboard W for 1.1s', 'canvas click-to-move'],
            consoleErrors: errors,
            consoleWarnings: warnings
          };
          fs.writeFileSync(path.join(out, 'test-report.json'), JSON.stringify(report, null, 2) + '\n');
          await browser.close();
          if (errors.length) throw new Error(`Runtime emitted ${errors.length} error(s): ${errors.join(' | ')}`);
          NODE

      - name: Commit unpacked source and screenshots
        run: |
          set -euo pipefail
          git add snow-resource-game docs/screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unpack and test Kimi one-shot prototype'
          git push
